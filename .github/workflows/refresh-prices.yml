name: Price refresh

# Runs 3x per weekday for a near-live feel:
#   14:00 UTC (10:00 ET — half-hour after US market open)
#   19:00 UTC (15:00 ET — mid-afternoon)
#   22:00 UTC (18:00 ET — after US market close, end-of-day data settled)
# Also triggerable manually via the Actions tab → "Run workflow".
on:
  schedule:
    - cron: '0 14 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet 'yfinance>=0.2.40' 'pandas>=2.0'

      - name: Refresh stocks.json
        run: python scripts/refresh_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet stocks.json; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git add stocks.json
          git commit -m "data: daily price refresh $(date -u +%Y-%m-%d)"
          git push
